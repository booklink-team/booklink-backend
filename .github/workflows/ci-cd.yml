name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Database=booklink;Username=postgres;Password=ci
      Jwt__Key: ci-only-signing-key-0123456789abcdef
      Seed__Password: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

      - name: Миграции не отстают от модели
        run: |
          dotnet tool install -g dotnet-ef --version 9.*
          dotnet ef migrations has-pending-model-changes -p src/Booklink.Infrastructure -s src/Booklink.Api

      - name: Smoke-тест на реальном PostgreSQL
        run: |
          dotnet run --no-build -c Release --project src/Booklink.Api --no-launch-profile --urls http://localhost:8080 &
          for i in $(seq 1 60); do curl -sf localhost:8080/swagger/v1/swagger.json -o /dev/null && break; sleep 1; done
          curl -sf localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"login":"student1","password":"ci"}' | grep -q accessToken

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
